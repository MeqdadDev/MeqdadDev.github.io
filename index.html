<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meqdad A. Darwish Resume</title>
  <style>
    :root {
      --bg-body: #f4f2ee;
      --bg-card: #ffffff;
      --bg-sidebar: #f8f6f2;
      --bg-summary: #faf9f7;
      --bg-skill: #ffffff;
      --bg-date: #f1efeb;
      --bg-stat: #f5f3f0;
      --bg-project: #faf9f7;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-light: #e8e6e1;
      --border-medium: #d6d3cd;
      --accent: #2d3748;
      --accent-hover: #1a202c;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      --toggle-bg: #d6d3cd;
    }

    [data-theme="dark"] {
      --bg-body: #12161c;
      --bg-card: #1e293b;
      --bg-sidebar: #1a202c;
      --bg-summary: #2d3748;
      --bg-skill: #2d3748;
      --bg-date: #2d3748;
      --bg-stat: #2d3748;
      --bg-project: #1a202c;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-light: #334155;
      --border-medium: #475569;
      --accent: #a0aec0;
      --accent-hover: #cbd5e1;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      --toggle-bg: #475569;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      line-height: 1.6;
      color: var(--text-primary);
      transition: background 0.3s, color 0.3s;
    }

    .resume {
      max-width: 1000px;
      width: 100%;
      background: var(--bg-card);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr 2fr;
      border: 1px solid var(--border-medium);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-sidebar);
      padding: 0.3rem 0.6rem 0.3rem 0.8rem;
      border-radius: 30px;
      border: 1px solid var(--border-medium);
      box-shadow: var(--shadow);
      transition: background 0.3s, border-color 0.3s;
      cursor: pointer;
      user-select: none;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
    }

    .theme-toggle .icon {
      font-size: 1.1rem;
      line-height: 1;
      transition: transform 0.2s;
    }

    .theme-toggle .icon.sun {
      opacity: 1;
    }

    .theme-toggle .icon.moon {
      opacity: 0.4;
    }

    [data-theme="dark"] .theme-toggle .icon.sun {
      opacity: 0.4;
    }

    [data-theme="dark"] .theme-toggle .icon.moon {
      opacity: 1;
    }

    .theme-toggle .slider {
      position: relative;
      width: 38px;
      height: 20px;
      background: var(--toggle-bg);
      border-radius: 30px;
      transition: background 0.3s;
      border: 1px solid var(--border-medium);
      flex-shrink: 0;
    }

    .theme-toggle .slider::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s, background 0.3s;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    [data-theme="dark"] .theme-toggle .slider::after {
      transform: translateX(18px);
      background: #f1f5f9;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      background: var(--bg-sidebar);
      padding: 2.4rem 2rem;
      border-right: 1px solid var(--border-medium);
      transition: background 0.3s, border-color 0.3s;
    }

    .sidebar .name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.1;
      margin-bottom: 0.2rem;
    }

    .sidebar .title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 1.2rem;
    }

    .sidebar .title a {
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1.5px solid var(--border-medium);
    }

    .sidebar .title a:hover {
      border-bottom-color: var(--accent);
    }

    .sidebar .divider {
      border: 0;
      height: 2px;
      background: var(--border-medium);
      margin: 1.4rem 0;
      transition: background 0.3s;
    }

    .sidebar h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }

    .contact-item {
      font-size: 0.85rem;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      min-width: 0;
      padding: 0.28rem 0.35rem;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 0.35rem;
      font: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
    }

    .contact-link:hover,
    .contact-link:focus-visible {
      background: var(--bg-skill);
      border-color: var(--border-medium);
      outline: none;
      transform: translateX(2px);
    }

    .contact-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 1.8rem;
      width: 1.8rem;
      height: 1.8rem;
      color: var(--contact-color, var(--accent));
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: 0.42rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
    }

    .contact-link:hover .contact-icon,
    .contact-link:focus-visible .contact-icon {
      transform: translateY(-1px);
      border-color: var(--contact-color, var(--accent));
    }

    .contact-icon svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .contact-icon .filled {
      fill: currentColor;
      stroke: none;
    }

    .contact-label {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .contact-action {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      margin-left: auto;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .contact-action svg {
      width: 0.8rem;
      height: 0.8rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .contact-copy.is-copied .contact-action {
      color: #059669;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .social-links a {
      font-size: 0.8rem;
      color: var(--text-primary);
      text-decoration: none;
      background: var(--bg-skill);
      border: 1px solid var(--border-medium);
      padding: 0.15rem 0.7rem;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .social-links a:hover {
      border-color: var(--accent);
    }

    .skill-group {
      margin-bottom: 0.6rem;
    }

    .skill-group-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .skill-tags span {
      background: var(--bg-skill);
      border: 1px solid var(--border-medium);
      padding: 0.15rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.01em;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .sidebar .meta-note {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-medium);
      padding-top: 1rem;
      line-height: 1.8;
      transition: border-color 0.3s, color 0.3s;
    }

    .sidebar .meta-note strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* ── MAIN CONTENT ── */
    .main {
      padding: 2.4rem 2.8rem 2.8rem 2.4rem;
      background: var(--bg-card);
      transition: background 0.3s;
    }

    .main .top-tagline {
      font-size: 0.85rem;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
      margin-bottom: 1.6rem;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid var(--border-light);
      transition: color 0.3s, border-color 0.3s;
    }

    .main .top-tagline strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .main .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--text-muted);
      margin: 2rem 0 0.8rem 0;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid var(--border-light);
      transition: color 0.3s, border-color 0.3s;
    }

    .main .section-title:first-of-type {
      margin-top: 0;
    }

    /* summary */
    .summary {
      background: var(--bg-summary);
      padding: 1.2rem 1.4rem;
      border-left: 4px solid var(--accent);
      margin-bottom: 0.5rem;
      transition: background 0.3s, border-color 0.3s;
    }

    .summary p {
      font-size: 0.95rem;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }

    .summary .highlight {
      background: var(--border-light);
      padding: 0.05rem 0.5rem;
      font-weight: 600;
      color: var(--text-primary);
      transition: background 0.3s, color 0.3s;
    }

    /* experience */
    .exp {
      margin-bottom: 1.6rem;
    }

    .exp-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.2rem 0.8rem;
    }

    .exp-header .role {
      font-size: 1.05rem;
      font-weight: 650;
      color: var(--text-primary);
    }

    .exp-header .role a {
      color: var(--text-primary);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }

    .exp-header .role a:hover {
      border-bottom-color: var(--accent);
      color: var(--accent);
    }

    .exp-header .date {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-date);
      padding: 0.05rem 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid var(--border-light);
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    .exp ul {
      list-style: none;
      padding-left: 0;
      margin-top: 0.2rem;
    }

    .exp ul li {
      position: relative;
      padding-left: 1.4rem;
      font-size: 0.92rem;
      color: var(--text-primary);
      margin-bottom: 0.15rem;
      transition: color 0.3s;
    }

    .exp ul li::before {
      content: "\2014";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 300;
      transition: color 0.3s;
    }

    /* education */
    .edu {
      margin-bottom: 1rem;
    }

    .edu .degree {
      font-size: 0.95rem;
      font-weight: 650;
      color: var(--text-primary);
    }

    .edu .institution {
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .edu .edu-year {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-date);
      padding: 0.05rem 0.8rem;
      border: 1px solid var(--border-light);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .edu .edu-notes {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* languages */
    .language-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
    }

    .language-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35rem;
    }

    .language-item .language-name {
      background: var(--bg-skill);
      border: 1px solid var(--border-medium);
      padding: 0.1rem 0.6rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-primary);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .language-level {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.35;
      padding-left: 0.1rem;
    }

    .language-detail {
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* skill section in main */
    .skill-section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem 1.6rem;
    }

    .skill-section-item .label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .skill-section-item .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .skill-section-item .tags span {
      background: var(--bg-skill);
      border: 1px solid var(--border-medium);
      padding: 0.1rem 0.6rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-primary);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    /* knowledge fields */
    .knowledge-list {
      list-style: none;
      padding: 0;
    }

    .knowledge-list li {
      font-size: 0.88rem;
      color: var(--text-primary);
      padding: 0.15rem 0;
    }

    /* projects */
    .project {
      background: var(--bg-project);
      border: 1px solid var(--border-light);
      padding: 1rem 1.2rem;
      margin-bottom: 0.8rem;
      transition: background 0.3s, border-color 0.3s;
    }

    .project .proj-name {
      font-size: 0.95rem;
      font-weight: 650;
      color: var(--text-primary);
    }

    .project .proj-name a {
      color: var(--text-primary);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }

    .project .proj-name a:hover {
      border-bottom-color: var(--accent);
      color: var(--accent);
    }

    .project .proj-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.3rem 0;
    }

    .project .proj-links a {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border-light);
      transition: border-color 0.2s, color 0.2s;
    }

    .project .proj-links a:hover {
      border-bottom-color: var(--accent);
      color: var(--text-primary);
    }

    .project .proj-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 0.4rem 0;
    }

    .project .proj-tags span {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-stat);
      padding: 0.05rem 0.5rem;
      border: 1px solid var(--border-light);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      transition: background 0.3s, border-color 0.3s;
    }

    .project .proj-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* articles */
    .article {
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
    }

    .article .art-title {
      font-weight: 600;
      color: var(--text-primary);
    }

    .article .art-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.15rem;
    }

    .article .art-links a {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border-light);
      transition: border-color 0.2s, color 0.2s;
    }

    .article .art-links a:hover {
      border-bottom-color: var(--accent);
      color: var(--text-primary);
    }

    /* certificates */
    .cert {
      margin-bottom: 0.4rem;
      font-size: 0.88rem;
    }

    .cert .cert-title {
      font-weight: 600;
      color: var(--text-primary);
    }

    .cert .cert-title a {
      color: var(--text-primary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .cert .cert-title a:hover {
      border-bottom-color: var(--accent);
    }

    .cert .cert-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* footer stats */
    .footer-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 2rem;
      margin-top: 2.2rem;
      padding-top: 1rem;
      border-top: 2px solid var(--border-light);
      transition: border-color 0.3s;
    }

    .footer-stats span {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-stat);
      padding: 0.1rem 1.2rem;
      border: 1px solid var(--border-light);
      letter-spacing: 0.02em;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    /* ── responsive ── */
    @media (max-width: 780px) {
      .resume {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border-medium);
        padding: 1.8rem;
      }

      .main {
        padding: 1.8rem;
      }

      .exp-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .skill-section-grid {
        grid-template-columns: 1fr;
      }

      .theme-toggle {
        top: 0.6rem;
        right: 0.6rem;
        padding: 0.2rem 0.5rem 0.2rem 0.6rem;
      }

      .theme-toggle .slider {
        width: 32px;
        height: 18px;
      }

      .theme-toggle .slider::after {
        width: 12px;
        height: 12px;
      }

      [data-theme="dark"] .theme-toggle .slider::after {
        transform: translateX(14px);
      }
    }

    @media (max-width: 450px) {
      body {
        padding: 0.5rem;
      }

      .sidebar {
        padding: 1.2rem;
      }

      .main {
        padding: 1.2rem;
      }

      .sidebar .name {
        font-size: 1.6rem;
      }

      .summary {
        padding: 0.8rem 1rem;
      }

      .language-grid {
        grid-template-columns: 1fr;
      }

      .footer-stats {
        gap: 0.4rem 1rem;
      }

      .footer-stats span {
        padding: 0.05rem 0.8rem;
        font-size: 0.7rem;
      }

      .theme-toggle .icon {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>

  <div class="resume" id="app">
    <!-- Theme toggle -->
    <div class="theme-toggle" id="themeToggle" role="button" tabindex="0" aria-label="Toggle theme">
      <span class="icon sun">☀️</span>
      <span class="slider"></span>
      <span class="icon moon">🌙</span>
    </div>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <!-- populated by JS -->
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main" id="mainContent">
      <!-- populated by JS -->
    </main>
  </div>

  <script>
    // ── Theme toggle logic ──
    (function initTheme() {
      const toggle = document.getElementById('themeToggle');
      const html = document.documentElement;

      // Load saved theme or default to light
      const saved = localStorage.getItem('resume-theme') || 'light';
      html.setAttribute('data-theme', saved);

      toggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', next);
        localStorage.setItem('resume-theme', next);
      });

      // Keyboard support
      toggle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle.click();
        }
      });
    })();

    // ── Fetch and render data ──
    async function loadResume() {
      try {
        const res = await fetch('data.json');
        if (!res.ok) throw new Error('Failed to load data.json');
        const data = await res.json();

        const contact = data.personal.contact;
        const social = data.personal.social || {};
        const stats = data.stats;

        const contactIcons = {
          email: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>`,
          linkedin: `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="filled" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.119 20.452H3.555V9H7.12v11.452z"></path></svg>`,
          github: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.4 4 5 5 0 0 0 19.3.5S18.2.1 15 2a13.4 13.4 0 0 0-7 0C4.8.1 3.7.5 3.7.5A5 5 0 0 0 3.6 4a5.4 5.4 0 0 0-1.4 3.7c0 5.3 3.5 6.5 6.8 7A4.8 4.8 0 0 0 8 18v4"></path><path d="M8 19c-3 .9-3-1.5-4-2"></path></svg>`,
          twitter: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l14 16M19 4 5 20"></path></svg>`,
          website: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>`,
          pypi: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path><path d="m4.3 7.7 7.7 4.4 7.7-4.4M12 12.1V21"></path></svg>`,
          medium: `<svg viewBox="0 0 176 160" aria-hidden="true"><path class="filled" d="m174.104 9.734.215-.047V8.02H130.39L89.6 103.89 48.81 8.021H1.472v1.666l.212.047c8.018 1.81 12.09 4.509 12.09 14.242V137.93c0 9.734-4.087 12.433-12.106 14.243l-.212.047v1.671h32.118v-1.665l-.213-.048c-8.018-1.809-12.089-4.509-12.089-14.242V30.586l52.399 123.305h2.972l53.925-126.743V140.75c-.687 7.688-4.721 10.062-11.982 11.701l-.215.05v1.652h55.948v-1.652l-.215-.05c-7.269-1.639-11.4-4.013-12.087-11.701l-.037-116.774h.037c0-9.733 4.071-12.432 12.087-14.242"></path></svg>`,
          devto: `<svg viewBox="0 0 48 40" aria-hidden="true"><rect class="filled" x="1" y="1" width="46" height="38" rx="4"></rect><path fill="#fff" stroke="none" d="M7 9h5.5c3.6 0 6.5 2.9 6.5 6.5v9c0 3.6-2.9 6.5-6.5 6.5H7V9zm4 4v14h1.5c1.38 0 2.5-1.12 2.5-2.5v-9c0-1.38-1.12-2.5-2.5-2.5H11zm10-4h11v4h-7v5h6v4h-6v5h7v4H21V9zm11 0h4l3 14 3-14h4l-5 22h-4L32 9z"></path></svg>`
        };

        // ── Sidebar ──
        document.getElementById('sidebar').innerHTML = `
          <div class="name">${data.personal.name}</div>
          <div class="title">
            ${data.personal.title.replace('Bunyan Flow', '<a href="https://bunyanflow.com">Bunyan Flow</a>')}
          </div>
          <hr class="divider" />
          <h3>Contact and Links</h3>
          <div class="contact-item" style="--contact-color: #e35d6a;">
            <a class="contact-link" href="mailto:${contact.email}">
              <span class="contact-icon">${contactIcons.email}</span>
              <span class="contact-label">${contact.email}</span>
            </a>
          </div>
          ${social.linkedin ? `<div class="contact-item" style="--contact-color: #0a66c2;">
            <a class="contact-link" href="${social.linkedin}" target="_blank" rel="noreferrer">
              <span class="contact-icon">${contactIcons.linkedin}</span>
              <span class="contact-label">LinkedIn</span>
            </a>
          </div>` : ''}
          <div class="contact-item" style="--contact-color: #6b7280;">
            <a class="contact-link" href="${contact.github}" target="_blank" rel="noreferrer">
              <span class="contact-icon">${contactIcons.github}</span>
              <span class="contact-label">GitHub</span>
            </a>
          </div>
          ${social.twitter ? `<div class="contact-item" style="--contact-color: #64748b;">
            <a class="contact-link" href="${social.twitter}" target="_blank" rel="noreferrer">
              <span class="contact-icon">${contactIcons.twitter}</span>
              <span class="contact-label">X / Twitter</span>
            </a>
          </div>` : ''}
          <div class="contact-item" style="--contact-color: #0ea5e9;">
            <button class="contact-link contact-copy" id="copyWebsite" type="button" data-copy="${contact.website}" aria-label="Copy website URL">
              <span class="contact-icon">${contactIcons.website}</span>
              <span class="contact-label">Website</span>
              <span class="contact-action" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"></path></svg>
                <span class="copy-status">Copy</span>
              </span>
            </button>
          </div>
          <div class="contact-item" style="--contact-color: #3775a9;">
            <a class="contact-link" href="${contact.pypi}" target="_blank" rel="noreferrer">
              <span class="contact-icon">${contactIcons.pypi}</span>
              <span class="contact-label">PyPI</span>
            </a>
          </div>
          ${social.medium ? `<div class="contact-item" style="--contact-color: var(--text-primary);">
            <a class="contact-link" href="${social.medium}" target="_blank" rel="noreferrer">
              <span class="contact-icon">${contactIcons.medium}</span>
              <span class="contact-label">Medium</span>
            </a>
          </div>` : ''}
          ${social.devto ? `<div class="contact-item" style="--contact-color: #0f0f0f;">
            <a class="contact-link" href="${social.devto}" target="_blank" rel="noreferrer">
              <span class="contact-icon">${contactIcons.devto}</span>
              <span class="contact-label">DEV.to</span>
            </a>
          </div>` : ''}
          <hr class="divider" />
          <h3>Impact</h3>
          ${stats.map(item => `${item}<br />`).join('')}
          <!-- 
          <div class="meta-note">
            Open-source Contributor <br />
            <strong>50k+</strong> Downloads for my Python Packages<br />
            <strong>2,000+</strong> Learners Trained<br />
            Technical Writing (Database &middot; AI &middot; Computer Vision &middot; Python)
          </div>
          -->
        `;

        // ── Main content ──
        const copyWebsite = document.getElementById('copyWebsite');
        copyWebsite?.addEventListener('click', async () => {
          const copyStatus = copyWebsite.querySelector('.copy-status');

          try {
            if (navigator.clipboard?.writeText) {
              await navigator.clipboard.writeText(copyWebsite.dataset.copy);
            } else {
              const textarea = document.createElement('textarea');
              textarea.value = copyWebsite.dataset.copy;
              textarea.style.position = 'fixed';
              textarea.style.opacity = '0';
              document.body.appendChild(textarea);
              textarea.select();
              const copied = document.execCommand('copy');
              textarea.remove();
              if (!copied) throw new Error('Copy failed');
            }

            copyWebsite.classList.add('is-copied');
            copyStatus.textContent = 'Copied';
            copyWebsite.setAttribute('aria-label', 'Website URL copied');

            window.setTimeout(() => {
              copyWebsite.classList.remove('is-copied');
              copyStatus.textContent = 'Copy';
              copyWebsite.setAttribute('aria-label', 'Copy website URL');
            }, 1800);
          } catch (error) {
            copyStatus.textContent = 'Failed';
            window.setTimeout(() => { copyStatus.textContent = 'Copy'; }, 1800);
            console.error('Could not copy website URL', error);
          }
        });

        const main = document.getElementById('mainContent');

        const summaryHTML = data.summary.map(p => `<p>${p}</p>`).join('');

        const expHTML = data.experience.map(exp => `
          <div class="exp">
            <div class="exp-header">
              <span class="role">${exp.url ? `<a href="${exp.url}">${exp.role} @ ${exp.company}</a>` : `${exp.role} @ ${exp.company}`}</span>
              <span class="date">${exp.date}</span>
            </div>
            <ul>
              ${exp.details.map(d => `<li>${d}</li>`).join('')}
            </ul>
          </div>
        `).join('');

        const eduHTML = data.education.map(ed => `
          <div class="edu">
            <div class="degree">${ed.degree} <span class="edu-year">${ed.year}</span></div>
            <div class="institution">${ed.institution}</div>
            ${ed.notes ? `<div class="edu-notes">${ed.notes}</div>` : ''}
          </div>
        `).join('');

        const skillsHTML = `
          <div class="skill-section-grid">
            ${Object.entries(data.skills).map(([cat, items]) => `
              <div class="skill-section-item">
                <div class="label">${cat}</div>
                <div class="tags">${items.map(s => `<span>${s}</span>`).join('')}</div>
              </div>
            `).join('')}
          </div>
        `;

        const languagesHTML = data.languages
          ? `<div class="language-grid" aria-label="Language proficiency">
              ${data.languages.map(language => `
                <div class="language-item">
                  <span class="language-name">${language.name}</span>
                  <div class="language-level">
                    ${language.level}${language.detail ? ` <span class="language-detail">(${language.detail})</span>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>`
          : '';

        const knowledgeHTML = data.knowledgeFields
          ? `<ul class="knowledge-list">${data.knowledgeFields.map(k => `<li>${k}</li>`).join('')}</ul>`
          : '';

        const projectsHTML = data.projects.map(p => `
          <div class="project">
            <div class="proj-name"><a href="${p.url}">${p.name}</a></div>
            <div class="proj-links">
              <a href="${p.url}">GitHub</a>
              ${p.pypi ? `<a href="${p.pypi}">PyPI</a>` : ''}
              ${p.docs ? `<a href="${p.docs}">Docs</a>` : ''}
            </div>
            <div class="proj-tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>
            <div class="proj-desc">${p.description}</div>
          </div>
        `).join('');

        const articlesHTML = data.articles.map(a => `
          <div class="article">
            <div class="art-title">${a.title}</div>
            <div class="art-links">
              ${a.medium ? `<a href="${a.medium}">Medium</a>` : ''}
              ${a.devto ? `<a href="${a.devto}">DEV.to</a>` : ''}
              ${a.gist ? `<a href="${a.gist}">Gist</a>` : ''}
            </div>
          </div>
        `).join('');

        const certsHTML = data.certificates.map(c => `
          <div class="cert">
            <span class="cert-title"><a href="${c.url}">${c.title}</a></span>
            <div class="cert-meta">${c.issuer} &middot; ${c.date}</div>
          </div>
        `).join('');

        const statsHTML = (data.stats || []).map(s => `<span>${s}</span>`).join('');

        main.innerHTML = `
          <div class="top-tagline"><strong>${data.personal.tagline}</strong></div>
          <section class="summary">${summaryHTML}</section>

          <h2 class="section-title">Experience</h2>
          ${expHTML}

          <h2 class="section-title">Education</h2>
          ${eduHTML}

          <h2 class="section-title">Technical Skills</h2>
          ${skillsHTML}

          ${data.knowledgeFields ? `<h2 class="section-title">Knowledge Fields</h2>${knowledgeHTML}` : ''}

          <h2 class="section-title">Projects &amp; Open Source</h2>
          ${projectsHTML}

          <h2 class="section-title">Articles &amp; Blogs</h2>
          ${articlesHTML}

          <h2 class="section-title">Certificates</h2>
          ${certsHTML}

          ${data.languages ? `<h2 class="section-title">Languages</h2>${languagesHTML}` : ''}

          <!-- <div class="footer-stats">${statsHTML}</div> -->
        `;
      } catch (err) {
        document.getElementById('mainContent').innerHTML = `
          <p style="color: var(--text-primary); padding: 2rem; text-align: center;">
            Could not load resume data. Make sure <code>data.json</code> exists alongside this file.
          </p>
        `;
        console.error(err);
      }
    }

    loadResume();
  </script>

</body>

</html>
